<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GVT 云桌面控制台 UI Test</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <div class="brand">
          <span class="brand-mark">G</span>
          <span>GVT Console</span>
        </div>
        <nav class="nav">
          <button class="nav-item active" data-view="desktops" title="桌面">
            <i data-lucide="monitor"></i><span>桌面</span>
          </button>
          <button class="nav-item" data-view="servers" title="服务器">
            <i data-lucide="server"></i><span>服务器</span>
          </button>
          <button class="nav-item" data-open-settings title="设置">
            <i data-lucide="settings"></i><span>设置</span>
          </button>
        </nav>
        <div class="server-chip">
          <span class="dot online"></span>
          <div>
            <strong id="serverName">openeuler111</strong>
            <span id="serverAddr">192.168.0.188:8090</span>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h1>云桌面</h1>
            <p>已登录 root@openeuler111，最近刷新 23:38:12</p>
          </div>
          <div class="top-actions">
            <button class="icon-btn" id="refreshBtn" title="刷新">
              <i data-lucide="refresh-cw"></i>
            </button>
            <button class="button ghost" data-open-settings>
              <i data-lucide="sliders-horizontal"></i><span>连接设置</span>
            </button>
            <button class="button primary">
              <i data-lucide="plus"></i><span>添加桌面</span>
            </button>
          </div>
        </header>

        <section class="stats-row" aria-label="运行概览">
          <div class="stat">
            <span>在线桌面</span>
            <strong>2 / 3</strong>
          </div>
          <div class="stat">
            <span>当前模式</span>
            <strong>实时 60fps</strong>
          </div>
          <div class="stat">
            <span>视频端口</span>
            <strong>5900 / 5905</strong>
          </div>
          <div class="stat">
            <span>主机负载</span>
            <strong>42%</strong>
          </div>
        </section>

        <section class="toolbar">
          <div class="tabs" role="tablist">
            <button class="tab active">全部</button>
            <button class="tab">运行中</button>
            <button class="tab">已关机</button>
            <button class="tab">物理屏</button>
          </div>
          <label class="search">
            <i data-lucide="search"></i>
            <input type="search" placeholder="搜索桌面、地址或端口" />
          </label>
        </section>

        <section class="desktop-grid" id="desktopGrid"></section>
      </main>

      <aside class="details" id="detailsPanel" aria-label="桌面详情">
        <div class="empty-detail">
          <i data-lucide="panel-right-open"></i>
          <strong>选择一个桌面</strong>
          <span>详情、模式、启动命令会显示在这里</span>
        </div>
      </aside>
    </div>

    <div class="modal-backdrop hidden" id="settingsModal">
      <section class="modal settings-modal" role="dialog" aria-modal="true" aria-label="连接设置">
        <header class="modal-header">
          <h2>连接设置</h2>
          <button class="icon-btn" data-close-settings title="关闭"><i data-lucide="x"></i></button>
        </header>
        <div class="form-grid">
          <label>
            <span>服务器地址</span>
            <input id="settingsHost" value="192.168.0.188" />
          </label>
          <label>
            <span>管理端口</span>
            <input id="settingsPort" value="8090" />
          </label>
          <label>
            <span>用户名</span>
            <input id="settingsUser" value="root" />
          </label>
          <label>
            <span>登录方式</span>
            <select>
              <option>密码</option>
              <option>密钥</option>
              <option>令牌</option>
            </select>
          </label>
        </div>
        <footer class="modal-footer">
          <label class="check">
            <input type="checkbox" checked />
            <span>启动应用后自动登录并刷新桌面</span>
          </label>
          <button class="button primary" id="loginBtn">
            <i data-lucide="log-in"></i><span>保存并登录</span>
          </button>
        </footer>
      </section>
    </div>

    <div class="viewer hidden" id="viewerWindow">
      <div class="viewer-titlebar">
        <div class="window-grip">
          <span></span><span></span><span></span>
        </div>
        <strong id="viewerTitle">win10-gvt-main</strong>
        <span id="viewerMode">客户端解码 · 60fps</span>
        <button class="button tiny" id="autoSizeBtn">AUTO</button>
        <button class="icon-btn" id="closeViewer" title="断开"><i data-lucide="x"></i></button>
      </div>
      <div class="viewer-stage" id="viewerStage" tabindex="0">
        <img id="viewerImage" src="assets/desktop-win10.png" alt="Windows 桌面画面" />
        <div class="physical-placeholder hidden" id="physicalPlaceholder">
          <i data-lucide="mouse-pointer-2"></i>
          <strong>物理显示屏输出中</strong>
          <span>视频经盒子 DP/HDMI 输出，当前窗口仅接收键鼠焦点</span>
        </div>
      </div>
      <div class="viewer-status" id="viewerStatus">
        <span><i data-lucide="radio"></i> H.264 RTP 5900</span>
        <span><i data-lucide="keyboard"></i> 原生输入 5905</span>
        <span><i data-lucide="volume-2"></i> SPICE 音频</span>
        <span id="viewerLatency">15ms</span>
      </div>
    </div>

    <template id="desktopCardTemplate">
      <article class="desktop-card">
        <button class="thumb" data-action="connect" title="连接">
          <img src="assets/desktop-win10.png" alt="" />
          <span class="state-pill"></span>
          <span class="stream-pill"></span>
        </button>
        <div class="desktop-body">
          <div class="desktop-title">
            <div>
              <h2></h2>
              <p></p>
            </div>
            <button class="icon-btn" data-action="detail" title="详情">
              <i data-lucide="info"></i>
            </button>
          </div>
          <div class="meta-line"></div>
          <div class="card-actions">
            <button class="icon-btn" data-action="power" title="开关机">
              <i data-lucide="power"></i>
            </button>
            <button class="icon-btn" data-action="connect" title="连接">
              <i data-lucide="play"></i>
            </button>
            <button class="icon-btn" data-action="detail" title="详情">
              <i data-lucide="panel-right"></i>
            </button>
          </div>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
